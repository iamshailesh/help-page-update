name: Log360 help-doc change monitor

on:
  schedule:
    # GitHub can't schedule "every 14 days" directly, so this runs every Monday
    # and the "Every 14 days?" step below skips the off weeks.
    - cron: "30 3 * * 1"   # Mondays, 03:30 UTC = 9:00 AM IST
  workflow_dispatch:        # Lets you run it manually from the Actions tab
    inputs:
      since:
        description: "One-off date (YYYY-MM-DD). Blank = use the date set in this file."
        required: false

permissions:
  contents: write           # Needed to commit the updated snapshots

concurrency:
  group: helpdoc-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Every 14 days?
        id: gate
        env:
          # ▼ First run date (must be a Monday). Runs repeat every 14 days from here. ▼
          START_DATE: "2026-10-12"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: always runs."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          days=$(( ( $(date -u +%s) - $(date -u -d "$START_DATE" +%s) ) / 86400 ))
          if [ "$days" -ge 0 ] && [ $(( days % 14 )) -lt 7 ]; then
            echo "Day $days since $START_DATE: run week."; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Day $days since $START_DATE: off week, skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'

      - name: Check help pages updated since the set date
        if: steps.gate.outputs.run == 'true'
        env:
          CONNECT_WEBHOOK_URL: ${{ secrets.CONNECT_WEBHOOK_URL }}
          REPORT_MODE: date         # only pages whose "Last updated on" date is on/after SINCE_DATE
          # ▼ SET YOUR DATE HERE (format YYYY-MM-DD) ▼
          SINCE_DATE: ${{ github.event.inputs.since || '2026-04-30' }}
        run: python monitor.py

      - name: Commit updated snapshots
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "helpdoc-monitor"
          git config user.email "helpdoc-monitor@users.noreply.github.com"
          git add snapshots
          git diff --cached --quiet || git commit -m "Help-doc snapshot $(date -u +%F)"
          git push
