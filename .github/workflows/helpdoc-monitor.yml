name: Log360 help-doc change monitor

on:
  schedule:
    - cron: "30 3 1 * *"   # 1st of every month, 03:30 UTC = 9:00 AM IST
  workflow_dispatch:        # Lets you run it manually from the Actions tab
    inputs:
      since:
        description: "One-off date (YYYY-MM-DD). Blank = use the date set in this file."
        required: false

permissions:
  contents: write           # Needed to commit the updated snapshots

concurrency:
  group: helpdoc-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check help pages updated since the set date
        env:
          CONNECT_WEBHOOK_URL: ${{ secrets.CONNECT_WEBHOOK_URL }}
          REPORT_MODE: date         # only pages whose "Last updated on" date is on/after SINCE_DATE
          # ▼ SET YOUR DATE HERE (format YYYY-MM-DD) ▼
          SINCE_DATE: ${{ github.event.inputs.since || '2026-04-30' }}
        run: python monitor.py

      - name: Commit updated snapshots
        run: |
          git config user.name  "helpdoc-monitor"
          git config user.email "helpdoc-monitor@users.noreply.github.com"
          git add snapshots
          git diff --cached --quiet || git commit -m "Help-doc snapshot $(date -u +%F)"
          git push
